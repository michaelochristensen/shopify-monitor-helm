{{- if .Values.proshopWatch.enabled }}
{{- $root := . }}
{{- range .Values.proshopWatch.targets }}
{{- $name := printf "%s-proshop-watch-%s" (include "shopify-monitor.fullname" $root) .productId }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
data:
  watch.sh: |
{{ $root.Files.Get "scripts/proshop-watch.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          image: "{{ $root.Values.proshopWatch.image }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - name: WATCH_URL
              value: {{ .url | quote }}
            - name: PRODUCT_ID
              value: {{ .productId | quote }}
            - name: DISCORD_WEBHOOK
              value: {{ $root.Values.proshopWatch.webhook | quote }}
            - name: INTERVAL
              value: {{ $root.Values.proshopWatch.intervalSeconds | quote }}
            - name: ITEM_TITLE
              value: {{ .itemTitle | quote }}
            - name: READER
              value: {{ $root.Values.proshopWatch.reader | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $root.Values.proshopWatch.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
