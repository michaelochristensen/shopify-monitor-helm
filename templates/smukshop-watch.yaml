{{- if .Values.smukshopWatch.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shopify-monitor.fullname" . }}-smukshop-watch
  labels:
    app.kubernetes.io/name: {{ include "shopify-monitor.name" . }}-smukshop-watch
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  watch.sh: |
{{ .Files.Get "scripts/smukshop-watch.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopify-monitor.fullname" . }}-smukshop-watch
  labels:
    app.kubernetes.io/name: {{ include "shopify-monitor.name" . }}-smukshop-watch
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shopify-monitor.name" . }}-smukshop-watch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shopify-monitor.name" . }}-smukshop-watch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          image: "{{ .Values.smukshopWatch.image }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - name: WATCH_URL
              value: {{ .Values.smukshopWatch.url | quote }}
            - name: DISCORD_WEBHOOK
              value: {{ .Values.smukshopWatch.webhook | quote }}
            - name: INTERVAL
              value: {{ .Values.smukshopWatch.intervalSeconds | quote }}
            - name: ITEM_TITLE
              value: {{ .Values.smukshopWatch.itemTitle | quote }}
            - name: ITEM_PRICE
              value: {{ .Values.smukshopWatch.itemPrice | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.smukshopWatch.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ include "shopify-monitor.fullname" . }}-smukshop-watch
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
